#cloud-config
# Paste as Vultr "Cloud-Init User-Data" when creating the VM. Not yet used on a real VM.
# Set the API key afterwards in /etc/blastbox.env (never commit it).
package_update: true
packages: [git]
runcmd:
  - git clone https://github.com/ajocircle-dev/blastbox.git /root/blastbox-src
  - bash /root/blastbox-src/deploy/setup.sh
